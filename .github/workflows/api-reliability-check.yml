name: API Reliability Check

on:
  push:
    branches: [main]
    paths:
      - '.github/api-reliability-trigger'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check all live endpoints
        env:
          RADAR_WEB_APP_URL: https://script.google.com/macros/s/AKfycbxpf5J0-61jaF1DF8LNrs3-DtAFNOhWaKlKXb7cHX8-ZsOxTHn35Gs9atalWaxKNuqU/exec
          RADAR_API_KEY: ${{ secrets.RADAR_API_KEY }}
        run: |
          node <<'NODE'
          const base=process.env.RADAR_WEB_APP_URL;
          const key=process.env.RADAR_API_KEY;
          if(!key) throw new Error('RADAR_API_KEY missing');

          async function req(method, action, params={}){
            let r;
            const started=Date.now();
            if(method==='GET'){
              const u=new URL(base);
              u.searchParams.set('action',action);
              u.searchParams.set('key',key);
              Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,String(v)));
              r=await fetch(u,{redirect:'follow',cache:'no-store'});
            }else{
              r=await fetch(base,{
                method:'POST',
                headers:{'Content-Type':'text/plain;charset=utf-8'},
                body:JSON.stringify({action,key,...params}),
                redirect:'follow'
              });
            }
            const text=await r.text();
            let json=null, parseError='';
            try{json=JSON.parse(text)}catch(e){parseError=e.message}
            console.log(JSON.stringify({
              method,action,status:r.status,ok:r.ok,
              contentType:r.headers.get('content-type'),
              url:r.url,
              ms:Date.now()-started,
              isJson:!!json,
              apiOk:json?.ok,
              apiError:json?.error||'',
              parseError,
              bodyPreview:json?undefined:text.slice(0,180)
            }));
            if(!json || !json.ok) process.exitCode=1;
          }

          await req('GET','health');
          await req('GET','daily-radar');
          await req('GET','brands',{status:'Available',limit:10});
          await req('GET','activities',{limit:10});
          await req('GET','credentials',{active:'true'});
          await req('GET','credential-matches',{brandId:'BR0408'});
          NODE
