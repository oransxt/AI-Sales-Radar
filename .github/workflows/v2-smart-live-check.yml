name: V2 Smart Intake Live Check

on:
  push:
    branches: [main]
    paths:
      - '.github/v2-smart-smoke-trigger'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check deployed Apps Script V2.0.1
        env:
          RADAR_WEB_APP_URL: https://script.google.com/macros/s/AKfycbxpf5J0-61jaF1DF8LNrs3-DtAFNOhWaKlKXb7cHX8-ZsOxTHn35Gs9atalWaxKNuqU/exec
          RADAR_API_KEY: ${{ secrets.RADAR_API_KEY }}
        run: |
          node <<'NODE'
          import fs from 'node:fs';

          const base = process.env.RADAR_WEB_APP_URL;
          const key = process.env.RADAR_API_KEY;
          if (!key) throw new Error('RADAR_API_KEY missing');

          async function get(action, params={}) {
            const u = new URL(base);
            u.searchParams.set('action', action);
            u.searchParams.set('key', key);
            for (const [k,v] of Object.entries(params)) u.searchParams.set(k, String(v));
            const r = await fetch(u, {redirect:'follow'});
            const t = await r.text();
            let j;
            try { j = JSON.parse(t); } catch { throw new Error(action+' non-JSON: '+t.slice(0,200)); }
            return j;
          }

          async function post(action, payload={}) {
            const r = await fetch(base, {
              method:'POST',
              headers:{'Content-Type':'text/plain;charset=utf-8'},
              body:JSON.stringify({action,key,...payload}),
              redirect:'follow'
            });
            const t = await r.text();
            let j;
            try { j = JSON.parse(t); } catch { throw new Error(action+' non-JSON: '+t.slice(0,200)); }
            return j;
          }

          const health = await get('health');
          const analyze = await post('credential-analyze', {
            driveUrl:'https://drive.google.com/file/d/1wGvhTiNTZuutv4sdp5qVQYtLkiJFmW5S/view?usp=drive_link'
          });

          const result = {
            checkedAt:new Date().toISOString(),
            health,
            analyze
          };
          fs.mkdirSync('docs/data',{recursive:true});
          fs.writeFileSync('docs/data/v2-smart-smoke-result.json', JSON.stringify(result,null,2));
          NODE
      - name: Commit check result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/v2-smart-smoke-result.json
          git commit -m "test: record V2 smart intake live check" || exit 0
          git push
