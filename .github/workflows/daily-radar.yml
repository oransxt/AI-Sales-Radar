name: Daily Thailand Brand Radar

on:
  workflow_dispatch:
  schedule:
    # Run away from the top-of-hour GitHub Actions load spike.
    - cron: '17 8 * * *'
      timezone: "Asia/Bangkok"
  push:
    branches: [main]
    paths:
      - 'scripts/discover.mjs'
      - 'scripts/sync-sheet.mjs'
      - '.github/workflows/daily-radar.yml'

permissions:
  contents: write

concurrency:
  group: daily-thailand-radar
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Discover Thailand Top 20 (100% free)
        run: node scripts/discover.mjs

      - name: Validate generated radar
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const daily = JSON.parse(fs.readFileSync('docs/data/daily.json', 'utf8'));
          const today = new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Asia/Bangkok',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit'
          }).format(new Date());
          if (daily.date !== today) throw new Error(`daily.json date mismatch: expected ${today}, got ${daily.date}`);
          if (!Array.isArray(daily.leads) || daily.leads.length !== 20) {
            throw new Error(`daily.json must contain exactly 20 leads; got ${daily.leads?.length ?? 0}`);
          }
          const names = daily.leads.map(x => String(x.brandName || '').trim());
          if (names.some(x => !x)) throw new Error('daily.json contains a blank brand name');
          console.log(`Validated 20 leads for ${today}.`);
          NODE

      - name: Commit updated radar data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/daily.json docs/data/history.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh free Thailand daily brand radar"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Sync Daily Radar to Google Sheets
        env:
          RADAR_WEB_APP_URL: https://script.google.com/macros/s/AKfycbxpf5J0-61jaF1DF8LNrs3-DtAFNOhWaKlKXb7cHX8-ZsOxTHn35Gs9atalWaxKNuqU/exec
          RADAR_API_KEY: ${{ secrets.RADAR_API_KEY }}
        run: node scripts/sync-sheet.mjs
