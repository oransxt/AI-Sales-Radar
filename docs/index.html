<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AI Sales Radar — Thailand</title>
<style>
:root{--nav:#151b35;--ink:#17203a;--muted:#69728a;--line:#e6e9f2;--bg:#f7f8fc;--blue:#4d5cff;--purple:#6d4cff;--green:#18a966;--orange:#ff8a34;--red:#eb4d4b;--card:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.sidebar{background:linear-gradient(180deg,#151b35,#11172e);color:#fff;padding:24px 14px;display:flex;flex-direction:column;gap:20px}.brand{padding:0 8px}.brand h1{font-size:17px;margin:0}.brand p{font-size:11px;opacity:.7;margin:5px 0 0}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#dfe3f3;text-align:left;padding:11px 12px;border-radius:9px;cursor:pointer}.nav button.active{background:linear-gradient(90deg,#4655ff,#654cff);color:#fff}.nav button:hover{background:#222a4b}.side-card{margin-top:auto;background:#202844;border:1px solid #303958;border-radius:12px;padding:14px}.side-card .big{font-size:24px;font-weight:800;margin-top:8px}.main{min-width:0}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:12px;position:sticky;top:0;z-index:5}.topbar h2{font-size:24px;margin:0}.subtitle{font-size:12px;color:var(--muted);margin-top:3px}.spacer{flex:1}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 12px;border-radius:9px;cursor:pointer}.btn.primary{background:linear-gradient(90deg,var(--blue),var(--purple));border:0;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.content{padding:20px 24px}.metrics{display:grid;grid-template-columns:repeat(6,minmax(115px,1fr));gap:10px;margin-bottom:16px}.metric{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px}.metric .n{font-size:22px;font-weight:800}.metric .l{font-size:11px;color:var(--muted);margin-top:3px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px}.panel,.full-panel{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden}.filters{padding:11px;border-bottom:1px solid var(--line);display:flex;gap:7px;align-items:center}.chip{border:0;background:#f2f4fa;padding:8px 10px;border-radius:8px;font-size:12px;cursor:pointer}.chip.active{background:#eceeff;color:#3445e8;font-weight:700}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th{background:#fbfbfd;color:#576078;text-align:left;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:10px;border-bottom:1px solid #eef0f5;vertical-align:top}tr{cursor:pointer}tbody tr:hover,tbody tr.selected{background:#f6f7ff}.brand-name{font-weight:750}.sub{color:var(--muted);font-size:11px}.score{display:inline-flex;align-items:center;padding:5px 8px;border-radius:8px;font-weight:800;background:#fff0ee;color:#d83d39}.status-select{border:1px solid #dfe3ed;background:#fff;border-radius:8px;padding:7px;min-width:118px}.detail{padding:14px}.detail h3{margin:0;font-size:20px}.badge{display:inline-block;font-size:10px;font-weight:800;padding:4px 7px;border-radius:20px;background:#e9fbf1;color:#158350}.detail-grid{display:grid;grid-template-columns:92px 1fr;gap:8px;margin-top:15px;font-size:12px}.k{color:var(--muted)}.v{font-weight:600}.section{border-top:1px solid var(--line);margin-top:14px;padding-top:13px}.section h4{margin:0 0 9px}.credential{border:1px solid var(--line);border-radius:9px;padding:9px;margin:7px 0;display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:start}.type{font-size:9px;text-transform:uppercase;color:#6658d9;font-weight:800}.link{color:#4157df;text-decoration:none;font-size:11px}.bottom{padding:11px;border-top:1px solid var(--line);display:flex;justify-content:center}.bottom .btn{min-width:330px}.full-panel{padding:18px}.form-grid{display:grid;grid-template-columns:180px 1.2fr 1fr 1.4fr;gap:8px;margin-bottom:15px}.form-grid input,.form-grid select{border:1px solid var(--line);border-radius:8px;padding:9px}.credential-row{display:grid;grid-template-columns:145px 1.5fr 1fr 140px 70px;gap:10px;padding:10px;border-top:1px solid var(--line);align-items:center;font-size:12px}.empty{text-align:center;padding:50px;color:var(--muted)}.notice{background:#fff8e8;border:1px solid #ffe0a3;color:#74540b;padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:12px}.loading{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.45}}@media(max-width:1100px){.metrics{grid-template-columns:repeat(3,1fr)}.workspace{grid-template-columns:1fr}.detail-panel{order:-1}.app{grid-template-columns:190px 1fr}}@media(max-width:760px){.app{display:block}.sidebar{display:none}.metrics{grid-template-columns:repeat(2,1fr)}.content{padding:12px}.topbar{padding:0 12px}.form-grid{grid-template-columns:1fr}.credential-row{grid-template-columns:1fr}.bottom .btn{min-width:0;width:100%}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand"><h1>AI SALES RADAR</h1><p>Thailand OOH Opportunity Finder · v1.9.2</p></div><div class="nav" id="nav"><button class="active" data-view="radar">◉ Daily Radar</button><button data-view="available">✓ Available Brands</button><button data-view="credentials">▣ Credential Library</button><button data-view="history">↻ History</button><button data-view="settings">⚙ Settings</button></div><div class="side-card"><div class="sub" style="color:#cfd5eb">Potential Pipeline (Available)</div><div class="big" id="sidePipeline">฿0M</div><div class="sub" style="color:#cfd5eb;margin-top:4px">AI estimated</div></div></aside>
<main class="main"><header class="topbar"><div><h2 id="title">DAILY 20 BRAND RADAR 🇹🇭</h2><div class="subtitle" id="subtitle">Thailand-first AI sales opportunity radar</div></div><div class="spacer"></div><div class="sub" id="today"></div><button class="btn" id="reloadBtn">↻ Reload Daily 20</button></header><div class="content" id="content"></div></main>
</div>
<script>
const TYPES=['Industry Overview','Case Study','New Launches','Media Credentials'];
const STATUSES=['Not Checked','Available','Has Owner','Existing Client','Skip'];
const LS={status:'asr-status-v192',credentials:'asr-creds-v192',selected:'asr-selected-v192',history:'asr-history-v192'};
const app={view:'radar',filter:'All',selected:null,daily:{generatedAt:null,leads:[]},statuses:JSON.parse(localStorage.getItem(LS.status)||'{}'),credentials:JSON.parse(localStorage.getItem(LS.credentials)||'[]'),selectedCreds:JSON.parse(localStorage.getItem(LS.selected)||'{}'),history:JSON.parse(localStorage.getItem(LS.history)||'{}')};
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(LS.status,JSON.stringify(app.statuses));localStorage.setItem(LS.credentials,JSON.stringify(app.credentials));localStorage.setItem(LS.selected,JSON.stringify(app.selectedCreds));localStorage.setItem(LS.history,JSON.stringify(app.history));}
function statusOf(l){return app.statuses[l.id]||'Not Checked'}
function leads(){return app.daily.leads||[]}
function counts(){const c={all:leads().length,available:0,owner:0,existing:0,skip:0,unchecked:0};for(const l of leads()){const s=statusOf(l);if(s==='Available')c.available++;else if(s==='Has Owner')c.owner++;else if(s==='Existing Client')c.existing++;else if(s==='Skip')c.skip++;else c.unchecked++;}return c}
function pipeline(){return leads().filter(l=>statusOf(l)==='Available').reduce((a,l)=>a+(Number(l.revenueMaxM)||0),0)}
function fmtM(n){return `฿${Number(n||0).toLocaleString(undefined,{maximumFractionDigits:1})}M`}
function sourceLinks(l){return (l.sources||[]).slice(0,3).map((s,i)=>`<a class="link" target="_blank" rel="noopener" href="${esc(s.url)}">${esc(s.label||`Source ${i+1}`)} ↗</a>`).join('<br>')}
function metrics(){const c=counts();return `<div class="metrics"><div class="metric"><div class="n">${c.all}</div><div class="l">Brands Found</div></div><div class="metric"><div class="n" style="color:#e86c25">${leads().filter(x=>x.score>=85).length}</div><div class="l">High Potential ≥85</div></div><div class="metric"><div class="n" style="color:#15965a">${c.available}</div><div class="l">Available</div></div><div class="metric"><div class="n">${c.owner}</div><div class="l">Has Owner</div></div><div class="metric"><div class="n">${c.existing}</div><div class="l">Existing Client</div></div><div class="metric"><div class="n">${c.skip}</div><div class="l">Skip</div></div></div>`}
function matchCredentials(l){const hay=(l.industry+' '+l.buyingSignal+' '+l.whyNow+' '+l.brandType).toLowerCase();return app.credentials.map(c=>{let score=0;if((c.industry||'').toLowerCase()===(l.industry||'').toLowerCase())score+=8;for(const t of c.tags||[])if(hay.includes(t.toLowerCase()))score+=2;if((c.name||'').toLowerCase().includes((l.industry||'').toLowerCase()))score+=3;return {...c,score}}).filter(c=>c.score>0).sort((a,b)=>b.score-a.score).slice(0,8)}
function credentialPack(l){const matched=matchCredentials(l),chosen=new Set(app.selectedCreds[l.id]||[]);if(!matched.length)return `<div class="sub">No matched credentials yet. Add Google Drive links in Credential Library.</div>`;return matched.map(c=>`<label class="credential"><input type="checkbox" data-cred="${esc(c.id)}" ${chosen.has(c.id)?'checked':''}><div><div class="type">${esc(c.type)} · AI match ${c.score}</div><strong>${esc(c.name)}</strong><div class="sub">${esc(c.industry||'General')} · ${(c.tags||[]).map(esc).join(', ')}</div></div><a class="link" target="_blank" rel="noopener" href="${esc(c.driveUrl)}">Open ↗</a></label>`).join('')}
function tableRows(ls){return ls.map((l,i)=>`<tr data-id="${esc(l.id)}" class="${app.selected===l.id?'selected':''}"><td>${i+1}</td><td><div class="brand-name">${esc(l.brandName)}</div><div class="sub">${esc(l.brandType)}</div></td><td>${esc(l.industry)}</td><td>${esc(l.buyingSignal)}</td><td><span class="score">${l.score}</span></td><td>${fmtM(l.revenueMinM)} – ${fmtM(l.revenueMaxM)}</td><td><select class="status-select" data-status="${esc(l.id)}">${STATUSES.map(s=>`<option ${statusOf(l)===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}
function detail(l){if(!l)return `<div class="empty">Select a brand.</div>`;return `<div class="detail"><span class="badge">${l.score>=85?'HOT':'OPPORTUNITY'}</span><h3>${esc(l.brandName)}</h3><div class="sub">${esc(l.companyName||'')} · ${esc(l.brandType)}</div><div style="display:flex;gap:12px;margin:14px 0"><div class="metric" style="flex:1"><div class="n" style="color:#e03e3e">${l.score}</div><div class="l">Opportunity Score</div></div><div class="metric" style="flex:1"><div class="n" style="font-size:17px">${fmtM(l.revenueMinM)}–${fmtM(l.revenueMaxM)}</div><div class="l">Potential Revenue</div></div></div><div class="detail-grid"><div class="k">Industry</div><div class="v">${esc(l.industry)}</div><div class="k">Buying Signal</div><div class="v">${esc(l.buyingSignal)}</div><div class="k">Why Now</div><div class="v">${esc(l.whyNow)}</div><div class="k">Thailand</div><div class="v">${esc(l.thailandEvidence)}</div><div class="k">Momentum</div><div class="v">${esc(l.momentum)}</div><div class="k">Signal Date</div><div class="v">${esc(l.signalDate)}</div><div class="k">Sources</div><div class="v">${sourceLinks(l)}</div></div><div class="section"><h4>Salesforce Status</h4><select class="status-select" style="width:100%" data-status="${esc(l.id)}">${STATUSES.map(s=>`<option ${statusOf(l)===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="section"><h4>Recommended Credential Pack</h4><div class="sub">Multiple selection · Google Drive links</div>${credentialPack(l)}<button class="btn" id="saveCreds" style="margin-top:7px">Save Selection</button></div></div>`}
function filtered(availableOnly=false){let ls=leads().slice();if(availableOnly)ls=ls.filter(l=>statusOf(l)==='Available');else if(app.filter!=='All')ls=ls.filter(l=>statusOf(l)===app.filter);return ls.sort((a,b)=>b.score-a.score)}
function radar(availableOnly=false){const ls=filtered(availableOnly);if(!app.selected||!leads().find(x=>x.id===app.selected))app.selected=ls[0]?.id||null;const sel=leads().find(x=>x.id===app.selected);$('#title').textContent=availableOnly?'AVAILABLE BRANDS':'DAILY 20 BRAND RADAR 🇹🇭';$('#subtitle').textContent=availableOnly?'Salesforce-cleared opportunities':'AI-discovered current buying signals in Thailand';$('#content').innerHTML=`${metrics()}<div class="workspace"><div class="panel"><div class="filters">${availableOnly?'':`<button class="chip ${app.filter==='All'?'active':''}" data-filter="All">All</button>${STATUSES.map(s=>`<button class="chip ${app.filter===s?'active':''}" data-filter="${s}">${s}</button>`).join('')}`}<div class="spacer"></div><span class="sub">Generated: ${esc(app.daily.generatedAt||'waiting for first automation')}</span></div><div class="table-wrap"><table><thead><tr><th>#</th><th>Brand</th><th>Industry</th><th>Buying Signal</th><th>Score</th><th>Potential Revenue</th><th>Salesforce</th></tr></thead><tbody>${tableRows(ls)}</tbody></table></div><div class="bottom"><button class="btn primary" ${counts().available?'':'disabled'}>ANALYZE ${counts().available} AVAILABLE BRANDS → VERSION 2</button></div></div><div class="panel detail-panel">${detail(sel)}</div></div>`;bindRadar();}
function bindRadar(){document.querySelectorAll('tbody tr[data-id]').forEach(r=>r.onclick=e=>{if(e.target.matches('select,a,input'))return;app.selected=r.dataset.id;render()});document.querySelectorAll('[data-status]').forEach(s=>s.onchange=e=>{app.statuses[s.dataset.status]=e.target.value;const l=leads().find(x=>x.id===s.dataset.status);app.history[s.dataset.status]={brandName:l?.brandName,industry:l?.industry,lastStatus:e.target.value,updatedAt:new Date().toISOString()};save();render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{app.filter=b.dataset.filter;render()});const saveBtn=$('#saveCreds');if(saveBtn)saveBtn.onclick=()=>{const l=leads().find(x=>x.id===app.selected);app.selectedCreds[l.id]=[...document.querySelectorAll('[data-cred]:checked')].map(x=>x.dataset.cred);save();alert('Credential pack saved');}}
function credentials(){const grouped=TYPES.map(t=>({t,items:app.credentials.filter(c=>c.type===t)}));$('#title').textContent='CREDENTIAL LIBRARY';$('#subtitle').textContent='Google Drive links for client credentials';$('#content').innerHTML=`<div class="full-panel"><div class="notice">Add links only. V1.9.2 does not copy your Drive files; it stores the link + metadata in this browser.</div><form class="form-grid" id="credForm"><select name="type">${TYPES.map(t=>`<option>${t}</option>`).join('')}</select><input name="name" placeholder="Credential / Folder name" required><input name="industry" placeholder="Industry e.g. Automotive"><input name="driveUrl" type="url" placeholder="Google Drive link" required><input name="tags" placeholder="Tags: EV, launch, premium" style="grid-column:1/4"><button class="btn primary">+ Add Credential</button></form>${grouped.map(g=>`<h3>${g.t}</h3>${g.items.length?g.items.map(c=>`<div class="credential-row"><div><span class="type">${esc(c.type)}</span></div><div><strong>${esc(c.name)}</strong><div class="sub">${(c.tags||[]).map(esc).join(', ')}</div></div><div>${esc(c.industry||'General')}</div><a class="link" href="${esc(c.driveUrl)}" target="_blank" rel="noopener">Open Drive ↗</a><button class="btn" data-del="${esc(c.id)}">Delete</button></div>`).join(''):`<div class="sub" style="margin-bottom:15px">No items yet.</div>`}`).join('')}</div>`;$('#credForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);app.credentials.push({id:crypto.randomUUID(),type:f.get('type'),name:f.get('name'),industry:f.get('industry'),driveUrl:f.get('driveUrl'),tags:String(f.get('tags')||'').split(',').map(x=>x.trim()).filter(Boolean)});save();credentials()};document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{app.credentials=app.credentials.filter(c=>c.id!==b.dataset.del);save();credentials()})}
function history(){const rows=Object.values(app.history);$('#title').textContent='HISTORY';$('#subtitle').textContent='Your previous Salesforce decisions on this browser';$('#content').innerHTML=`<div class="full-panel">${rows.length?`<table><thead><tr><th>Brand</th><th>Industry</th><th>Last Status</th><th>Updated</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.brandName)}</td><td>${esc(x.industry)}</td><td>${esc(x.lastStatus)}</td><td>${esc(x.updatedAt)}</td></tr>`).join('')}</tbody></table>`:`<div class="empty">History will appear after your Salesforce checks.</div>`}</div>`}
function settings(){const dataUrl=new URL('data/daily.json',location.href).href;$('#title').textContent='SETTINGS';$('#subtitle').textContent='Version 1.9.2 Online Edition';$('#content').innerHTML=`<div class="full-panel"><h3>Online Architecture</h3><p>GitHub Pages hosts this dashboard. GitHub Actions runs Thailand Brand Discovery daily and writes the latest Top 20 to <code>docs/data/daily.json</code>. Your OpenAI API key stays in GitHub Secrets and is never exposed to this browser.</p><p><strong>Daily data:</strong> <a class="link" href="${esc(dataUrl)}" target="_blank">Open JSON ↗</a></p><p><strong>Local browser data:</strong> Salesforce statuses, credentials and selections are stored in localStorage for V1.</p></div>`}
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===app.view));$('#sidePipeline').textContent=fmtM(pipeline());$('#reloadBtn').style.display=['radar','available'].includes(app.view)?'inline-block':'none';if(app.view==='radar')radar(false);else if(app.view==='available')radar(true);else if(app.view==='credentials')credentials();else if(app.view==='history')history();else settings();}
async function loadDaily(){try{const r=await fetch(`data/daily.json?t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error('daily.json not found');app.daily=await r.json();if(!app.selected)app.selected=app.daily.leads?.[0]?.id||null;}catch(e){app.daily={generatedAt:null,leads:[]};}render()}
document.querySelector('#nav').onclick=e=>{const b=e.target.closest('[data-view]');if(!b)return;app.view=b.dataset.view;render()};$('#reloadBtn').onclick=loadDaily;$('#today').textContent=new Date().toLocaleDateString('en-GB',{timeZone:'Asia/Bangkok',day:'2-digit',month:'short',year:'numeric'});loadDaily();
</script>
</body></html>
